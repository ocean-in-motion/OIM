<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message received — O.I.M.</title>
<meta name="description" content="Thanks for reaching out to Ocean in Motion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/oim-logo-white.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chatbot.css">
<style>
  .ty-hero{
    min-height:92vh; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:160px var(--pad) 60px;
  }

  /* ---------- signal stage: expanding sonar rings + logo reveal + confirmation check ---------- */
  .signal-stage{
    position:relative; width:168px; height:168px; margin:0 auto 36px;
    display:flex; align-items:center; justify-content:center;
  }
  .signal-ring{
    position:absolute; inset:0; border-radius:50%; border:1px solid var(--sonar-dim);
    opacity:0; animation:signalPulse 2.6s cubic-bezier(.15,.65,.3,1) infinite;
  }
  .signal-ring.r2{ animation-delay:.7s; }
  .signal-ring.r3{ animation-delay:1.4s; }
  @keyframes signalPulse{
    0%{ transform:scale(.32); opacity:0; }
    12%{ opacity:.9; }
    100%{ transform:scale(1.7); opacity:0; }
  }

  .signal-logo{
    position:relative; z-index:2; width:72px; height:72px;
    opacity:0; clip-path:circle(0% at 50% 50%);
    filter:drop-shadow(0 0 0 rgba(61,188,202,0));
    animation:signalLogoIn 1.1s cubic-bezier(.4,0,.2,1) forwards .3s;
  }
  @keyframes signalLogoIn{
    0%{ opacity:0; clip-path:circle(0% at 50% 50%); filter:drop-shadow(0 0 0 rgba(61,188,202,0)); }
    35%{ opacity:1; }
    100%{ opacity:1; clip-path:circle(52% at 50% 50%); filter:drop-shadow(0 0 22px var(--sonar-glow)); }
  }

  .signal-check{
    position:absolute; z-index:3; width:36px; height:36px; right:2px; bottom:2px;
    opacity:0; transform:scale(.4); animation:checkPop .45s cubic-bezier(.34,1.56,.64,1) forwards 1.45s;
  }
  @keyframes checkPop{ to{ opacity:1; transform:scale(1); } }
  .signal-check circle{ fill:var(--abyss); stroke:var(--sonar); stroke-width:2.5; }
  .signal-check path{
    fill:none; stroke:var(--sonar); stroke-width:3; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:34; stroke-dashoffset:34; animation:checkDraw .4s ease forwards 1.65s;
  }
  @keyframes checkDraw{ to{ stroke-dashoffset:0; } }

  /* ---------- staggered copy reveal ---------- */
  .ty-copy > *{ opacity:0; transform:translateY(14px); animation:tyCopyIn .7s ease forwards; }
  .ty-copy .eyebrow{ justify-content:center; margin-bottom:16px; animation-delay:1.9s; }
  .ty-copy h1{ font-size:clamp(32px,5.6vw,54px); margin-bottom:16px; animation-delay:2.05s; }
  .ty-copy p{ max-width:480px; margin:0 auto 34px; color:var(--dim); font-size:16px; animation-delay:2.2s; }
  .ty-copy .hero-actions{ animation-delay:2.35s; }
  @keyframes tyCopyIn{ to{ opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="brand-mark"><img src="assets/oim-logo-white.svg" alt="O.I.M."><span class="brand-text">O.I.M.</span></a>
  <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="packages.html">Packages</a>
    <a href="contact.html" class="nav-cta">Contact</a>
  </div>
</nav>

<header class="ty-hero">
  <div class="hero-inner">
    <div class="signal-stage">
      <div class="signal-ring r1"></div>
      <div class="signal-ring r2"></div>
      <div class="signal-ring r3"></div>
      <img class="signal-logo" src="assets/oim-logo-white.svg" alt="O.I.M.">
      <svg class="signal-check" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="27"/>
        <path d="M18 31l8 8 16-18"/>
      </svg>
    </div>

    <div class="ty-copy">
      <div class="eyebrow">Signal received</div>
      <h1>Message received.</h1>
      <p>Thanks for reaching out — expect a reply within 1–2 business days. In the meantime, feel free to look around.</p>
      <div class="hero-actions" style="display:flex; gap:16px; justify-content:center; flex-wrap:wrap;">
        <a href="index.html" class="btn btn-primary">Back to home</a>
        <a href="packages.html" class="btn btn-ghost">View packages</a>
      </div>
    </div>
  </div>
</header>

<footer>
  <div class="foot-brand">© <span id="year"></span> Ocean in Motion — O.I.M.</div>
  <div class="foot-links">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</footer>

<script src="js/main.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="js/chatbot.js"></script>
</body>
</html>
