<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message sent — Mel Carter Photography</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="../images/mel-logo.svg">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#26241d; --cream:#faf7f1; --sage-deep:#5c6155; --sage:#848b79; --gold:#bd9a4c; --line:#e3ddcc; --muted:#83806f; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(120% 90% at 50% -10%, #ffffff 0%, var(--cream) 46%, #efe8d7 100%);
    color:var(--ink); font-family:'Jost',sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 24px;
  }
  h1,h2{font-family:'Cormorant Garamond',serif; font-weight:600;}
  .card{max-width:460px;}
  .mark{
    width:88px; height:88px; margin:0 auto 26px; display:block; border-radius:14%;
    object-fit:cover; background:var(--sage); box-shadow:0 1px 2px rgba(38,36,29,0.12);
  }
  .eyebrow{font-weight:500; font-size:11.5px; letter-spacing:0.22em; text-transform:uppercase; color:var(--sage-deep); margin-bottom:14px;}
  h1{font-size:clamp(28px,5vw,40px); margin-bottom:16px;}
  p{color:var(--muted); font-size:16px; margin-bottom:30px;}
  .btn{
    font-family:'Jost',sans-serif; font-weight:500; font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase;
    padding:14px 26px; border-radius:999px; border:1px solid var(--sage-deep); background:var(--sage-deep); color:var(--cream);
    display:inline-block; transition:transform .2s ease;
  }
  .btn:hover{transform:translateY(-2px);}
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="../images/mel-logo.svg" alt="Mel Carter Photography">
    <div class="eyebrow">Mel Carter Photography</div>
    <h1>Message sent.</h1>
    <p>Thank you for reaching out — I read every message and reply within two business days. Talk soon.</p>
    <a href="../" class="btn">Back to the site</a>
  </div>
</body>
</html>
